# crypto-config.yaml - cryptogen input for the local permissioned audit network.
#
# Generated certificates are DEV-ONLY material for a local test network.
# Production deployment must use a real Fabric CA per organization (see
# fabric/README.md and docs/PHASE2_NETWORK_DESIGN.md). No production use.

